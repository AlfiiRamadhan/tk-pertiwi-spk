# Konfigurasi Nixpacks untuk Railway

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.openssl",
  "php83Extensions.curl",
]

[phases.build]
cmds = ["chmod +x /app/start.sh"]

[start]
cmd = "sh /app/start.sh"

